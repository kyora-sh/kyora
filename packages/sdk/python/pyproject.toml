[project]
name = "kyora"
version = "0.1.1"
description = "Python SDK for kyora cloud sandboxes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pydantic>=2.7", "typing-extensions>=4.12"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://kyora.sh"
Repository = "https://github.com/kyora-sh/kyora"

[dependency-groups]
dev = [
  "datamodel-code-generator==0.83.0",
  "pytest>=8",
  "respx>=0.22",
  "ruff>=0.14",
  "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kyora"]

[tool.uv]
exclude-newer = "2026-10-13T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/kyora/_models.py", "src/kyora/_error_codes.py", "src/kyora/_operations.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
