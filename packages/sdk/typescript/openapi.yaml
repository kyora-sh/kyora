components:
  securitySchemes:
    bearer:
      type: http
      scheme: Bearer
      description: "A kyora token (kyora_...): a personal or org token, or a scoped token whose capabilities and constraints narrow what it reaches. A cloud session's child token (kys_...) reaches a subset of the sandbox routes, for the sandboxes its session created."
  parameters:
    SandboxId:
      name: id
      in: path
      required: true
      description: "The sandbox's id (sb_...), its name, or a unique prefix of its id."
      schema:
        type: string
        minLength: 1
    LabelFilter:
      name: label
      in: query
      required: false
      description: "key=value, split at the first =; repeat it to require every pair. The key follows the label key rules of Labels."
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_./-]{0,62}="
    Limit:
      name: limit
      in: query
      required: false
      description: The most rows a page holds.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    Cursor:
      name: cursor
      in: query
      required: false
      description: The next_cursor of the previous page; opaque.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: "Idempotency-Key"
      in: header
      required: false
      description: "Makes a create safe to repeat: the same key with the same body answers the first attempt's result instead of creating again; the same key with a different body is 409 create_key_conflict."
      schema:
        type: string
        minLength: 1
        maxLength: 128
  headers:
    RetryAfter:
      description: Seconds to wait before repeating the request.
      schema:
        type: integer
        minimum: 0
  responses:
    Error:
      description: "An error. error is a code from x-kyora-error-codes."
      headers:
        "Retry-After":
          "$ref": "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "A machine-readable code, listed in x-kyora-error-codes."
        message:
          type: string
          description: "A readable reason, for people. It can change; never branch on it."
        retryable:
          type: boolean
          description: "On a 429 or 503 (absent on a few older codes and on other statuses): repeating the same request later can succeed. Absent, take it from x-kyora-error-codes."
        retryAfterMs:
          type: integer
          minimum: 0
          description: "On a retryable 429 or 503: the least time to wait before repeating, in milliseconds, as Retry-After says. Absent, use Retry-After when there is one."
    Health:
      type: object
      required:
        - ok
        - version
        - capacity
      properties:
        ok:
          const: true
        version:
          const: "kyora-cloud"
        capacity:
          type: object
          required:
            - vcpusFree
            - memoryMbFree
          properties:
            vcpusFree:
              type: number
              minimum: 0
            memoryMbFree:
              type: number
              minimum: 0
    Labels:
      type: object
      description: "Up to 31 labels. Keys are 1-63 characters of A-Za-z0-9_./- starting with a letter or digit; values up to 256 characters."
      maxProperties: 31
      propertyNames:
        pattern: "^[A-Za-z0-9][A-Za-z0-9_./-]{0,62}$"
      additionalProperties:
        type: string
        maxLength: 256
    NetworkMode:
      type: string
      description: "none: no network. registries: package registries only. open: the internet. ci and ci-strict: the CI profiles."
      enum:
        - none
        - registries
        - open
        - ci
        - "ci-strict"
    SandboxStatus:
      type: string
      enum:
        - starting
        - running
        - moving
        - moved
        - incoming
        - destroyed
        - lost
        - failed
    Sandbox:
      type: object
      required:
        - id
        - status
        - shareable
        - network
        - egressAllow
        - vcpus
        - allocatedVcpus
        - memoryMb
        - diskGb
        - image
        - labels
        - ttlSeconds
        - idleSeconds
        - createdAt
        - expiresAt
      properties:
        id:
          type: string
          pattern: ^sb_
        name:
          type: string
          pattern: "^[a-z0-9-]{1,32}$"
        status:
          "$ref": "#/components/schemas/SandboxStatus"
        shareable:
          type: boolean
        network:
          "$ref": "#/components/schemas/NetworkMode"
        egressAllow:
          type: array
          items:
            type: string
        vcpus:
          type: number
        allocatedVcpus:
          type: number
        maxMemoryMb:
          type: integer
        autoscale:
          type: boolean
        memoryMb:
          type: integer
        diskGb:
          type:
            - integer
            - "null"
        image:
          type: string
        labels:
          "$ref": "#/components/schemas/Labels"
        ttlSeconds:
          type: integer
          minimum: 0
          description: "0: no expiry."
        idleSeconds:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: "date-time"
        expiresAt:
          type:
            - string
            - "null"
          format: "date-time"
          description: "null: no expiry."
        lastActivityAt:
          type: string
          format: date-time
          description: When the sandbox was last active; `idleSeconds` counts from it.
        region:
          type:
            - string
            - "null"
          description: "The region, when kyora runs more than one."
        requestedRegion:
          type: string
          description: "On a create placed in another region than the one asked for: the one asked for."
        destroyedAt:
          type: string
