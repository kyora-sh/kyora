paths:
  /v1/health:
    get:
      operationId: getHealth
      tags:
        - account
      summary: Health and free capacity
      responses:
        "200":
          description: kyora cloud answers.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Health"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
      security: []
  /v1/regions:
    get:
      operationId: listRegions
      tags:
        - account
      summary: List regions
      responses:
        "200":
          description: "Regions and the caller's default."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RegionList"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      tags:
        - account
      summary: Get the account the token acts for
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Me"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  /v1/me/region:
    put:
      operationId: setDefaultRegion
      tags:
        - account
      summary: Set the default region
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SetRegionRequest"
      responses:
        "200":
          description: The new default.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SetRegionResponse"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  /v1/tokens:
    get:
      operationId: listTokens
      tags:
        - account
      summary: List tokens
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenList"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
    post:
      operationId: createToken
      tags:
        - account
      summary: Create a scoped token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: "The token, shown once."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateTokenResponse"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  "/v1/tokens/{id}":
    delete:
      operationId: deleteToken
      tags:
        - account
      summary: Revoke a token
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Revoked.
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  "/v1/orgs/{org}/tokens":
    get:
      operationId: listOrgTokens
      tags:
        - account
      summary: List org tokens
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TokenList"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
    post:
      operationId: createOrgToken
      tags:
        - account
      summary: Create an org token
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: "The token, shown once."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreateTokenResponse"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  "/v1/orgs/{org}/tokens/{id}":
    delete:
      operationId: deleteOrgToken
      tags:
        - account
      summary: Revoke an org token
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: Revoked.
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  /v1/usage:
    get:
      operationId: getUsage
      tags:
        - account
      summary: Get usage
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Usage"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  /v1/sandboxes:
    post:
      operationId: createSandbox
      tags:
        - sandboxes
      summary: Create a sandbox
      parameters:
        - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSandboxRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Sandbox"
        "202":
          description: "Queued, or a starting restore."
          content:
            application/json:
              schema:
                oneOf:
                  - "$ref": "#/components/schemas/QueueTicket"
                  - "$ref": "#/components/schemas/Sandbox"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
    get:
      operationId: listSandboxes
      tags:
        - sandboxes
      summary: List sandboxes
      description: Newest first. Keep paging while next_cursor is present.
      parameters:
        - "$ref": "#/components/parameters/LabelFilter"
        - "$ref": "#/components/parameters/Limit"
        - "$ref": "#/components/parameters/Cursor"
        - name: stats
          in: query
          required: false
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: "A page of sandboxes, or stats."
          content:
            application/json:
              schema:
                oneOf:
                  - "$ref": "#/components/schemas/SandboxList"
                  - "$ref": "#/components/schemas/SandboxStats"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  "/v1/sandboxes/{id}":
    get:
      operationId: getSandbox
      tags:
        - sandboxes
      summary: Get a sandbox
      parameters:
        - "$ref": "#/components/parameters/SandboxId"
      responses:
        "200":
          description: The sandbox.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Sandbox"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
    patch:
      operationId: updateSandbox
      tags:
        - sandboxes
      summary: Update a sandbox
      description: "Rename, change TTL, grow disk, or resize vcpus/memoryMb; see the request schema."
      parameters:
        - "$ref": "#/components/parameters/SandboxId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateSandboxRequest"
      responses:
        "200":
          description: The sandbox.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Sandbox"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
    delete:
      operationId: deleteSandbox
      tags:
        - sandboxes
      summary: Delete a sandbox
      parameters:
        - "$ref": "#/components/parameters/SandboxId"
      responses:
        "204":
          description: Deleted.
        "202":
          description: Deletion pending.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeleteSandboxPending"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  "/v1/sandboxes/{id}/resolve":
    get:
      operationId: resolveSandbox
      tags:
        - sandboxes
      summary: Resolve a sandbox reference
      parameters:
        - "$ref": "#/components/parameters/SandboxId"
      responses:
        "200":
          description: The resolved id.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResolveResponse"
        "4XX":
          "$ref": "#/components/responses/Error"
        "5XX":
          "$ref": "#/components/responses/Error"
  "/v1/queue/{ticket}":
    get:
      operationId: getQueueTicket
      tags:
        - sandboxes
      summary: Poll a queue ticket
      parameters:
        - name: ticket
          in: path
          required: true
          schema:
