        imageMaxGb: { type: number, minimum: 0, description: "Account image storage (1 GB is 1e9 bytes), uploads in flight included." }
        imageMaxRootBytes: { type: integer, minimum: 1, description: "The largest root filesystem one account image may have, in bytes." }
