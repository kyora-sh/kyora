        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
          description: "Idempotency key; needs resumable: true."
      additionalProperties: false
    ExecFrame:
      description: |
        One line of an exec stream. Read until `exit` (the command ended), `detached` (the connection
        ended, a resumable command keeps running: reattach with attachExec) or `error`.
      oneOf:
        - { $ref: "#/components/schemas/ExecStartedFrame" }
        - { $ref: "#/components/schemas/ExecAttachedFrame" }
        - { $ref: "#/components/schemas/ExecOutputFrame" }
        - { $ref: "#/components/schemas/ExecGapFrame" }
        - { $ref: "#/components/schemas/ExecPingFrame" }
        - { $ref: "#/components/schemas/ExecExitFrame" }
        - { $ref: "#/components/schemas/ExecErrorFrame" }
        - { $ref: "#/components/schemas/ExecDetachedFrame" }
    ExecStartedFrame:
      type: object
      description: First line of a resumable exec; `id` reattaches to it.
      required: [type, resumable]
      properties:
        type: { const: started }
        id: { type: string }
        resumable: { type: boolean }
        from: { type: string }
        key: { type: string, description: The exec `key` this command runs under. }
        existing: { type: boolean, description: "true: the key named a command that was already running; this is it." }
    ExecAttachedFrame:
      type: object
      description: First line of a reattach.
      required: [type, id, running]
      properties:
        type: { const: attached }
        id: { type: string }
        running: { type: boolean }
        from: { type: string }
    ExecOutputFrame:
      type: object
      description: Output, as UTF-8 text in `data`, or base64 in `b64` when it isn't valid UTF-8.
      required: [type]
      properties:
        type: { type: string, enum: [stdout, stderr] }
        data: { type: string }
        b64: { type: string, contentEncoding: base64 }
    ExecGapFrame:
      type: object
      description: Output between byte offsets `from` and `to` of `stream` is lost (it left the buffer before it was read).
      required: [type, stream, from, to]
      properties:
        type: { const: gap }
        stream: { type: string, enum: [stdout, stderr] }
        from: { type: integer, minimum: 0 }
        to: { type: integer, minimum: 0 }
    ExecPingFrame:
      type: object
      description: |
        A heartbeat while the command is quiet. `stdout` and `stderr` are the byte offsets sent so far.
        `source` is sent only to a client that asks for independent counters.
      required: [type]
      properties:
        type: { const: ping }
        from: { type: string, enum: [machine, cloud] }
        seq: { type: integer, minimum: 0 }
        stdout: { type: integer, minimum: 0 }
        stderr: { type: integer, minimum: 0 }
        source: { type: string, enum: [node, vmd] }
    ExecExitFrame:
      type: object
      description: The command ended. Always the last line of a stream that ends normally.
      required: [type, code, signal, durationMs, timedOut]
      properties:
        type: { const: exit }
        code: { type: [integer, "null"], description: "The exit code; null when a signal ended the command." }
        signal: { type: [string, integer, "null"], description: "The signal that ended the command (a Linux name or number), or null." }
        durationMs: { type: number, minimum: 0 }
        timedOut: { type: boolean, description: "true: the exec's timeout stopped the command." }
        bytes:
          type: object
          description: A resumable command's total output per stream; a client that read fewer bytes missed some.
          required: [stdout, stderr]
          properties:
            stdout: { type: integer, minimum: 0 }
            stderr: { type: integer, minimum: 0 }
    ExecErrorFrame:
      type: object
      description: The stream failed; the command may not have run to the end.
      required: [type, message]
      properties:
        type: { const: error }
        message: { type: string }
    ExecDetachedFrame:
      type: object
      description: The connection ended and the resumable command keeps running; reattach with attachExec.
      required: [type, reason]
      properties:
        type: { const: detached }
        reason: { type: string }
    ExecCancelResponse:
      type: object
      required:
        - cancelled
      properties:
        cancelled:
          type: boolean
        running:
          type: boolean
    Snapshot:
      type: object
      required:
        - id
        - kind
        - status
        - name
        - sandbox
        - bytes
        - logicalBytes
        - dataBytes
        - image
        - resumable
        - createdAt
