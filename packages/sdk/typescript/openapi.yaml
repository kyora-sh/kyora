openapi: 3.1.0
info:
  title: kyora vms API
  version: 1.0.0-beta.1
  summary: Sandboxes, snapshots, public URLs, pages, images and object storage on kyora cloud.
  description: |
    The HTTP API the `kyora` CLI and integrators use at `https://cloud.kyora.sh`.

    ## Conventions

    - Bodies are JSON (`application/json`) unless an operation says otherwise. Responses carry no envelope.
    - Times are ISO 8601 strings, except where a field says epoch milliseconds.
    - A sandbox in a path (`{id}`) is its full id (`sb_...`), its name, or a unique prefix of its id that
      starts with `sb_`. A prefix that matches several sandboxes is `409 ambiguous_prefix`.
    - Encode path segments and query values.

    ## Errors

    Every error is `{"error": "<code>", "message": "<a readable reason>"}`, sometimes with more fields
    (`Error`). Branch on `error`, never on `message`. `x-kyora-error-codes` lists every code with the
    statuses it comes with and whether repeating the same request can succeed (`retryable`: `true` or
    `false` for every status, or the list of statuses after which it can): take retryability from
    there. A 429 or 503 also says it in the body: `retryable`, and for a retryable one `retryAfterMs`
    with a `Retry-After` header (seconds); wait at least that long. Other statuses, and a few 429 and
    503 codes whose bodies predate these fields (`rate_limited`, `node_offline` and the like), carry
    neither field, so fall back to the catalog when they are absent.

    ## Stability

    - `/v1` changes are additive only: new operations, new optional request fields, new response
      fields, new error codes and new enum values. Clients must ignore fields they don't know and treat
      an unknown error code by its status.
    - A breaking change ships as `/v2`, or after a deprecation of at least six months announced with a
      `Deprecation` header (RFC 9745) and a `Sunset` header on the affected operations.
    - `info.version` follows semver and the SDKs track it. While it is a `1.0.0-beta`, the guarantees
      above already hold for `/v1`; the beta covers the spec's completeness, not the API's stability.
  contact:
    name: kyora
    url: https://kyora.sh
servers:
  - url: https://cloud.kyora.sh
security:
  - bearer: []
tags:
  - name: account
    description: Health, regions, the account a token acts for, tokens and usage.
  - name: sandboxes
    description: Create, list, inspect, change and destroy sandboxes; the create queue.
  - name: exec
    description: Run commands and reattach to them.
  - name: files
    description: Push and pull archives, multipart uploads.
  - name: network
    description: Network modes, public ports and custom domains.
  - name: computer
    description: The desktop of a sandbox with a display, its live view and shares.
  - name: terminals
    description: Interactive terminals over WebSockets.
  - name: snapshots
    description: Take, list and restore snapshots.
  - name: pages
    description: Static pages served from kyora.
  - name: images
    description: Account images built from a base or pushed in chunks.
  - name: storage
    description: S3-like buckets and objects.
