name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Linux jobs (the Rust jobs, ts, the TypeScript CLIs and SDK, and python, the Python SDK) run on a fresh kyora VM (kyora-2x4-apac: 2 vCPU / 4 GB, in apac only). Fork pull
# requests stay on GitHub-hosted runners, so they never wait for a runner that won't come. macOS has
# no kyora runner and stays on GitHub's, as does the ci-ok gate (one shell test, no VM needed).

jobs:
  fmt:
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check

  clippy:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os != 'ubuntu-latest' && matrix.os || (github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: cargo test --workspace --locked

  ts:
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --concurrency=2
      - run: bunx turbo run check-types --concurrency=2
      - run: bunx turbo run test --concurrency=1 --continue=dependencies-successful
      - run: bun test ./.github/scripts/

  python:
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'kyora-2x4-apac' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run scripts/generate.py --check
      - run: uv run pytest

  ci-ok:
    if: ${{ always() }}
    needs: [fmt, clippy, test, ts, python]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          CHECKS_PASSED: ${{ needs.fmt.result == 'success' && needs.clippy.result == 'success' && needs.test.result == 'success' && needs.ts.result == 'success' && needs.python.result == 'success' }}
        run: test "$CHECKS_PASSED" = true
