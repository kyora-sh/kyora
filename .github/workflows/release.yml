name: Release

# Every push to main opens or updates the "chore: release" pull request from the pending changesets.
# Once it merges (no changesets left), preflight checks every registry that is turned on, and only
# then does anything publish. npm, crates.io and PyPI stay off until the repo vars KYORA_PUBLISH_NPM,
# KYORA_PUBLISH_CRATES and KYORA_PUBLISH_PYPI are "true"; all publish from protected environments.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'kyora-sh/kyora' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version-packages
          pr-title: "chore: release"
          commit-message: "chore: release"

  preflight:
    needs: version
    if: needs.version.outputs.pending == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      npm: ${{ steps.npm.outputs.npm }}
      crates: ${{ steps.crates.outputs.crates }}
      pypi: ${{ steps.pypi.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: npm
        run: bun .github/scripts/release.ts npm-preflight
        env:
          # reads GitHub releases, to finish a published version that has none
          GH_TOKEN: ${{ github.token }}
      - id: crates
        if: vars.KYORA_PUBLISH_CRATES == 'true'
        run: |
          rustup show
          bun .github/scripts/release.ts crates-preflight
      - if: vars.KYORA_PUBLISH_PYPI == 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - id: pypi
        if: vars.KYORA_PUBLISH_PYPI == 'true'
        run: bun .github/scripts/release.ts pypi-preflight
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    needs: preflight
    if: vars.KYORA_PUBLISH_NPM == 'true' && needs.preflight.outputs.npm != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing (OIDC) needs npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - run: bun .github/scripts/release.ts npm-publish
        env:
          # only for a package's first publish; trusted publishing needs no token
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}

  crates:
    needs: [preflight, npm]
    # after npm, so a failed npm publish never leaves crates published alone
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped') &&
      vars.KYORA_PUBLISH_CRATES == 'true' && needs.preflight.outputs.crates != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates
    permissions:
      contents: write
      id-token: write
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: rustup show
      # trusted publishing once the crates exist; CARGO_REGISTRY_TOKEN only for their first publish
      - id: auth
        if: env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: bun .github/scripts/release.ts crates-publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: [preflight, npm]
    # after npm, so a failed npm publish never leaves the Python SDK ahead of @kyora-sh/sdk
    if: >-
      !cancelled() && needs.preflight.result == 'success' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped') &&
      vars.KYORA_PUBLISH_PYPI == 'true' && needs.preflight.outputs.pypi != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - id: build
        run: bun .github/scripts/release.ts pypi-build
        env:
          GH_TOKEN: ${{ github.token }}
      # trusted publishing (OIDC): the publisher on PyPI names this workflow and the pypi environment
      - if: steps.build.outputs.publish == '1'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: packages/sdk/python/dist
          # dist holds only the files PyPI lacked; this covers one it shows late
          skip-existing: true
      - run: bun .github/scripts/release.ts pypi-finish
        env:
          GH_TOKEN: ${{ github.token }}
